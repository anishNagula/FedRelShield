output_dir: ~/code/ULTRA/output/fedrelshield/relation_aware

dataset_root: ~/code/ULTRA/data/fedrelshield

clients:
  - enterprise_a
  - enterprise_b
  - enterprise_c
  - enterprise_d
  - enterprise_e

checkpoint: ~/code/ULTRA/ckpts/ultra_4g.pth

model:
  relation_model:
    class: RelNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes

  entity_model:
    class: EntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes

task:
  name: TransductiveInference
  num_negative: 256
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 5.0e-4

train:
  batch_size: 8

federation:
  num_rounds: 1
  local_epochs: 1
  batch_per_epoch: 20
  aggregation_method: relation_aware
  divergence_strength: 5.0
  alpha: 1.0

evaluation:
  split: valid

checkpointing:
  enabled: yes
  checkpoint_path: ~/code/ULTRA/output/fedrelshield/relation_aware/federated_checkpoint.pth
